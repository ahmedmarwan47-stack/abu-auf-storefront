<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    Stand-in artwork for images/abuauf/icons/flash-sale-3d.png — the flash-sale
    badge in the desktop utility bar. In-house, NOT a client asset: it is drawn
    to sit beside the real 3D set (voucher/points/wallet) until the client's own
    render lands. Regenerate the PNG with build/art/render.sh.
    Palette is tokens only: primary #185039 / #346853, accent yellow #EDC843.
  -->
  <defs>
    <linearGradient id="tileFace" x1="34" y1="30" x2="212" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A8467"/>
      <stop offset=".45" stop-color="#2C6248"/>
      <stop offset="1" stop-color="#17402D"/>
    </linearGradient>
    <linearGradient id="tileSide" x1="128" y1="150" x2="128" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#173F2C"/>
      <stop offset="1" stop-color="#0E2B1E"/>
    </linearGradient>
    <linearGradient id="boltFace" x1="104" y1="56" x2="160" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBEBAE"/>
      <stop offset=".38" stop-color="#EDC843"/>
      <stop offset="1" stop-color="#C99A1E"/>
    </linearGradient>
    <radialGradient id="glow" cx="128" cy="120" r="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EDC843" stop-opacity=".38"/>
      <stop offset="1" stop-color="#EDC843" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0B2418" flood-opacity=".34"/>
    </filter>
    <filter id="boltShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0B2418" flood-opacity=".45"/>
    </filter>
  </defs>

  <!-- contact shadow on the ground -->
  <ellipse cx="128" cy="232" rx="72" ry="11" fill="#0B2418" opacity=".18"/>

  <g filter="url(#soft)">
    <!-- extruded side: same squircle, pushed down, so the tile reads as a slab -->
    <rect x="30" y="42" width="196" height="192" rx="58" fill="url(#tileSide)"/>
    <!-- top face -->
    <rect x="30" y="26" width="196" height="192" rx="58" fill="url(#tileFace)"/>
    <!-- bevel: one lit arc riding the top-left of the squircle, plus a faint
         inner rim. A straight bar across the top read as a seam, not a bevel. -->
    <path d="M36 108a58 58 0 0 1 58-58h68" stroke="#9CCDB2" stroke-opacity=".45" stroke-width="6" stroke-linecap="round" fill="none"/>
    <rect x="37" y="33" width="182" height="178" rx="53" fill="none" stroke="#FFFFFF" stroke-opacity=".13" stroke-width="3"/>
  </g>

  <circle cx="128" cy="122" r="86" fill="url(#glow)"/>

  <g filter="url(#boltShadow)">
    <!-- underside of the bolt, offset down so the glyph sits proud of the tile -->
    <path d="M148 66 L94 138 L124 138 L108 200 L168 122 L138 122 Z"
          transform="translate(0,7)" fill="#8F6A10" opacity=".85"
          stroke="#8F6A10" stroke-width="9" stroke-linejoin="round"/>
    <path d="M148 66 L94 138 L124 138 L108 200 L168 122 L138 122 Z"
          fill="url(#boltFace)" stroke="url(#boltFace)" stroke-width="9" stroke-linejoin="round"/>
    <!-- specular: one short highlight down the lit edge, nothing more -->
    <path d="M139 84 L116 114" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
