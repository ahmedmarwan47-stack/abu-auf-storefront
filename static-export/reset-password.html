<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>إعادة تعيين كلمة المرور | أبو عوف</title>
    <meta name="description" content="اختر كلمة مرور جديدة لحسابك في أبو عوف." />
    <!-- Tailwind (Play CDN) + Abu Auf design system -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tw-config.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="images/abuauf/brand/logo-abuauf-white.svg" />
    <script defer src="scripts.js"></script>
  </head>
  <body data-page="reset-password" data-path="/reset-password" class="antialiased bg-white">
    <!-- Shared header is injected here by scripts.js -->
    <div id="site-header"></div>

    <main class="overflow-x-hidden">
      <section class="pt-6">
        <div class="flex flex-col gap-4 mx-auto px-4 xl:px-[190px] max-w-[1920px]">
          <nav aria-label="مسار التنقل" class="flex flex-wrap items-center gap-2 text-sm"><a href="index.html" class="text-neutral-secondary hover:text-primary transition-colors">الرئيسية</a><span aria-hidden="true" class="text-neutral-outline">/</span><span class="font-semibold text-[#062A1C]">إعادة تعيين كلمة المرور</span></nav>
          <h1 class="font-bold text-[#062A1C] text-3xl xl:text-5xl"></h1>
        </div>
      </section>

      <section class="py-8 xl:py-12">
        <div class="items-start gap-6 xl:gap-8 grid max-w-[560px] mx-auto mx-auto px-4 xl:px-[190px] max-w-[1920px]">
          
          <div class="flex flex-col gap-6 bg-white shadow-custom4 p-8 xl:p-10 rounded-[20px]">
            <h1 class="font-bold text-[#062A1C] text-2xl xl:text-3xl text-center">إعادة تعيين كلمة المرور</h1>
            <form class="flex flex-col gap-5">
              <p class="text-neutral-secondary text-sm text-center leading-7">
                اختر كلمة مرور جديدة لحسابك.
              </p>

                <div class="flex flex-col gap-1.5">
                  <label for="password" class="font-medium text-neutral-secondary text-sm">كلمة السر الجديدة</label>
                  <div class="relative">
                    <input type="password" id="password" name="password" required
                           class="bg-white px-4 py-3 pe-12 border-2 border-neutral-divider focus:border-cta rounded-xl outline-none w-full text-[#062A1C] text-base transition-colors" />
                    <button type="button" data-reveal="password" aria-label="إظهار كلمة السر"
                            class="top-1/2 end-3 absolute text-neutral-secondary hover:text-cta -translate-y-1/2 transition-colors">
                      <svg viewBox="0 0 24 24" fill="none" class="w-5 h-5">
                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="1.7"/>
                        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/>
                      </svg>
                    </button>
                  </div>
                </div>

                <div class="flex flex-col gap-1.5">
                  <label for="password-confirm" class="font-medium text-neutral-secondary text-sm">تأكيد كلمة السر</label>
                  <div class="relative">
                    <input type="password" id="password-confirm" name="password-confirm" required
                           class="bg-white px-4 py-3 pe-12 border-2 border-neutral-divider focus:border-cta rounded-xl outline-none w-full text-[#062A1C] text-base transition-colors" />
                    <button type="button" data-reveal="password-confirm" aria-label="إظهار كلمة السر"
                            class="top-1/2 end-3 absolute text-neutral-secondary hover:text-cta -translate-y-1/2 transition-colors">
                      <svg viewBox="0 0 24 24" fill="none" class="w-5 h-5">
                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="1.7"/>
                        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/>
                      </svg>
                    </button>
                  </div>
                </div>
              <button type="submit" class="bg-cta hover:bg-cta-hover py-4 rounded-full font-semibold text-white text-base transition-colors">حفظ كلمة المرور</button>
            </form>
            
          </div>
        </div>
      </section>
    </main>

    <!-- Shared footer is injected here by scripts.js -->
    <div id="site-footer"></div>
  </body>
</html>
