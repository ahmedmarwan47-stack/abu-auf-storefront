<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>إنشاء حساب | أبو عوف</title>
    <meta name="description" content="أنشئ حساب في أبو عوف برقم موبايلك واكسب نقاط في محفظتك مع كل طلب." />
    <meta name="theme-color" content="#163300" />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="إنشاء حساب | أبو عوف" />
    <meta property="og:description" content="أنشئ حساب في أبو عوف برقم موبايلك واكسب نقاط في محفظتك مع كل طلب." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="أبو عوف" />
    <meta property="og:locale" content="ar_EG" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Abu Auf design system. Tailwind is COMPILED AT BUILD TIME by
         `npm run css` (config: tailwind.config.js) into tailwind.css. It used
         to be the Play CDN, which Tailwind itself warns against in production:
         that shipped ~120KB of JavaScript which then had to scan the DOM and
         generate the stylesheet on every visit, so nothing was styled until it
         finished — a flash of unstyled content on exactly the slow mobile
         connections this storefront is for. Now it is one 30KB cacheable file.

         ORDER IS LOAD-BEARING: tailwind.css first, styles.css second.
         styles.css contains rules whose whole purpose is to beat a utility
         ([hidden] !important, the focus ring re-armed over `outline-none`,
         the sticky-nav selector). Reverse these two and they stop working. -->
    <link rel="stylesheet" href="tailwind.css" />
    <link rel="stylesheet" href="styles.css" />
    <!-- The client's 3D leaf mark as the tab icon (Ahmed, 2026-08-05) — the
         same spec-leaf.png the mega-panel bullets and product benefits use, so
         the favicon is a recognisable brand glyph rather than the white
         wordmark, which reads as a blank sliver at 16px. -->
    <link rel="icon" type="image/png" href="images/abuauf/icons/spec-leaf.png" />
    <!-- The English dictionary, generated by build/i18n.py. Also `defer`, and
         listed FIRST: deferred scripts run in document order, so this has
         always defined window.ABUAUF_I18N by the time scripts.js boots and
         merges it. A plain script rather than a fetch, so the language switch
         still works from file://. -->
    <script defer src="i18n-en.js"></script>
    <script defer src="scripts.js"></script>
  </head>
  <body data-page="register" data-path="/register" class="antialiased bg-white">
    <!-- First focusable thing on the page. The header is three bands and a
         mega-menu, so a keyboard shopper otherwise tabbed through the whole
         of it on every page before reaching any content. Visually hidden
         until focused. -->
    <a href="#main" class="skip-link">تخطي إلى المحتوى</a>

    <!-- Shared header is injected here by scripts.js -->
    <div id="site-header"></div>

    <main id="main" tabindex="-1" class="overflow-x-clip">
      <section data-reveal class="pt-6">
        <div class="flex flex-col gap-4 mx-auto px-4 max-w-[1536px]">
          <nav aria-label="مسار التنقل" class="flex flex-wrap items-center gap-2 text-sm"><a href="index.html" class="link-sweep text-neutral-secondary hover:text-primary transition-colors">الرئيسية</a><span aria-hidden="true" class="text-neutral-outline">/</span><span class="font-semibold text-[#062A1C]">إنشاء حساب</span></nav>
        </div>
      </section>

      <section data-reveal class="py-8 xl:py-12">
        <div class="items-stretch gap-6 xl:gap-8 grid grid-cols-1 max-w-[560px] mx-auto mx-auto px-4 max-w-[1536px]">
          
          <!-- The two auth cards are equal-height (items-stretch on the grid).
               Titles pin to the top (aligned); the sign-in page passes
               form_contents=True and its own flex-1 regions so the CTA centres
               on the same line as the create-account button (Ahmed, 2026-08-04). -->
          <div class="flex flex-col gap-6 bg-white shadow-custom4 p-8 xl:p-10 rounded-[20px] min-w-0">
            
            <h1 class="font-bold text-[#062A1C] text-2xl xl:text-3xl text-center">إنشاء حساب جديد</h1>
            <form class="flex flex-col gap-5" data-register-form>
              <div class="gap-4 grid sm:grid-cols-2">

                <div class="flex flex-col gap-1.5 ">
                  <label for="first-name" class="font-medium text-neutral-secondary text-sm">الاسم الأول<span class="text-accent-error">*</span></label>
                  <input type="text" id="first-name" name="first-name" required autocomplete="given-name"
                         value="" placeholder=""
                         class="bg-white px-4 py-3 border-2 border-neutral-divider focus:border-cta rounded-xl outline-none w-full text-[#062A1C] text-base transition-colors" />
                </div>

                <div class="flex flex-col gap-1.5 ">
                  <label for="last-name" class="font-medium text-neutral-secondary text-sm">الاسم الاخير<span class="text-accent-error">*</span></label>
                  <input type="text" id="last-name" name="last-name" required autocomplete="family-name"
                         value="" placeholder=""
                         class="bg-white px-4 py-3 border-2 border-neutral-divider focus:border-cta rounded-xl outline-none w-full text-[#062A1C] text-base transition-colors" />
                </div>
              </div>

                <div class="flex flex-col gap-1.5" data-phone-field>
                  <label for="phone" class="font-medium text-neutral-secondary text-sm">رقم الموبايل<span class="text-accent-error">*</span></label>
                  <div dir="ltr" data-phone-box class="flex items-stretch bg-white border-2 border-neutral-divider focus-within:border-cta rounded-xl overflow-hidden transition-colors">
                    <span class="flex items-center gap-1.5 ps-3.5 pe-3 shrink-0 font-semibold text-[#062A1C] text-sm"><span class="text-base leading-none" aria-hidden="true">🇪🇬</span><span class="latin">+20</span></span>
                    <!-- The prefix/number divider is a standalone rule, NOT a
                         border on the chip: `my-2.5` insets it top and bottom so
                         it stops short of the field's rounded edges. It stays
                         CONSTANT in every state — same colour, same width — while
                         ONLY the outer field border darkens on focus (Ahmed,
                         2026-08-04). -->
                    <span aria-hidden="true" class="self-stretch bg-neutral-divider my-2.5 w-px shrink-0"></span>
                    <!-- The placeholder is one UNBROKEN digit run, no spaces.
                         styles.css forces `direction: rtl` on every tel input
                         (so the digits align to the start like every other
                         field), and an RTL paragraph reorders the three LTR
                         runs of a spaced number: "100 123 4567" was painted as
                         "4567 123 100" on login, register and here. A single
                         run has nothing to reorder. -->
                    <input type="tel" id="phone" name="phone" required autocomplete="tel" dir="ltr" value=""
                           placeholder="1001234567"
                           class="flex-1 bg-transparent px-3 py-3 outline-none min-w-0 text-[#062A1C] text-base latin" />
                  </div>
                  
                  
                </div>

                <div class="flex flex-col gap-1.5 ">
                  <label for="email" class="font-medium text-neutral-secondary text-sm">البريد الالكتروني<span class="text-accent-error">*</span></label>
                  <input type="email" id="email" name="email" required autocomplete="email"
                         value="" placeholder=""
                         class="bg-white px-4 py-3 border-2 border-neutral-divider focus:border-cta rounded-xl outline-none w-full text-[#062A1C] text-base transition-colors" />
                </div>
              <!-- Where the OTP goes. Real radios (radio_card), so the checked
                   state IS the submitted value — scripts.js reads
                   [name="otp-channel"]:checked and nothing else. -->
              <fieldset class="flex flex-col gap-1.5">
                <legend class="mb-1.5 font-medium text-neutral-secondary text-sm">استلام رمز التحقق عن طريق</legend>
                <div class="flex sm:flex-row flex-col gap-3">

                <!-- min-w-0 on BOTH nested flex children. A flex item's
                     min-width is `auto`, so without these the label column
                     cannot shrink below its longest line and pushes the whole
                     checkout form wider than its grid track. Caught at 375 in
                     English, where the form ran 31px over and the page's
                     `overflow-x-hidden` swallowed it — clipped copy that no
                     amount of scrolling reveals, which is exactly why
                     CLAUDE.md calls this the most common bug class here.
                     Arabic never showed it: "أرسل الطلب كهدية لشخص تحبه" is
                     simply shorter than "Send this order as a gift to someone
                     you love". Latent until the site actually translated. -->
                <label class="flex-1 min-w-0 cursor-pointer">
                  <input type="radio" name="otp-channel" value="whatsapp" class="peer sr-only" checked />
                  <span class="flex justify-between items-center gap-3 bg-white px-5 py-4 border-2 border-neutral-divider peer-checked:border-cta rounded-xl transition-colors h-full">
                    <span class="radio-card__body flex items-center gap-3 min-w-0">
                      <span class="text-cta shrink-0"><svg viewBox="0 0 24 24" fill="#25D366" class="w-5 h-5"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.2c5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2Zm5.8 14.03c-.24.68-1.42 1.3-1.95 1.35-.5.05-.97.23-3.27-.68-2.77-1.09-4.52-3.92-4.66-4.1-.13-.18-1.1-1.47-1.1-2.8 0-1.34.7-2 .95-2.27.25-.27.54-.34.72-.34h.52c.17 0 .4-.06.62.47.24.56.8 1.94.87 2.08.07.14.12.3.02.48-.09.18-.14.3-.27.46-.14.16-.29.36-.41.48-.14.14-.28.29-.12.56.16.27.71 1.17 1.52 1.9 1.05.93 1.93 1.22 2.2 1.36.28.14.44.11.6-.07.16-.18.69-.8.88-1.08.18-.27.37-.23.62-.14.25.09 1.6.75 1.87.89.28.14.46.2.53.32.07.11.07.66-.17 1.34Z"/></svg></span>
                      <span class="flex flex-col min-w-0">
                        <span class="font-semibold text-[#062A1C] text-base">واتساب</span>
                        <span class="text-neutral-secondary text-xs">على رقم الموبايل</span>
                      </span>
                    </span>
                    <span class="radio-dot shrink-0" aria-hidden="true"></span>
                  </span>
                </label>

                <!-- min-w-0 on BOTH nested flex children. A flex item's
                     min-width is `auto`, so without these the label column
                     cannot shrink below its longest line and pushes the whole
                     checkout form wider than its grid track. Caught at 375 in
                     English, where the form ran 31px over and the page's
                     `overflow-x-hidden` swallowed it — clipped copy that no
                     amount of scrolling reveals, which is exactly why
                     CLAUDE.md calls this the most common bug class here.
                     Arabic never showed it: "أرسل الطلب كهدية لشخص تحبه" is
                     simply shorter than "Send this order as a gift to someone
                     you love". Latent until the site actually translated. -->
                <label class="flex-1 min-w-0 cursor-pointer">
                  <input type="radio" name="otp-channel" value="email" class="peer sr-only" />
                  <span class="flex justify-between items-center gap-3 bg-white px-5 py-4 border-2 border-neutral-divider peer-checked:border-cta rounded-xl transition-colors h-full">
                    <span class="radio-card__body flex items-center gap-3 min-w-0">
                      <span class="text-cta shrink-0"><svg viewBox="0 0 24 24" fill="none" class="w-5 h-5"><rect x="2" y="4" width="20" height="16" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="m2 7 10 6 10-6" stroke="currentColor" stroke-width="1.7"/></svg></span>
                      <span class="flex flex-col min-w-0">
                        <span class="font-semibold text-[#062A1C] text-base">البريد الالكتروني</span>
                        <span class="text-neutral-secondary text-xs">على الإيميل</span>
                      </span>
                    </span>
                    <span class="radio-dot shrink-0" aria-hidden="true"></span>
                  </span>
                </label>
                </div>
              </fieldset>
              <label class="flex items-start gap-2 cursor-pointer">
                <input type="checkbox" required class="mt-1 accent-[#163300] w-4 h-4" />
                <span class="text-neutral-secondary text-sm leading-6">
                  أوافق على <a href="terms-conditions.html" class="font-semibold text-cta underline">الشروط والأحكام</a>
                </span>
              </label>
              <button type="submit" class="bg-cta hover:bg-cta-hover py-4 rounded-full font-semibold text-white text-base transition-colors">إنشاء حساب</button>
              <p class="text-neutral-secondary text-sm text-center">
                لديك حساب بالفعل؟ <a href="login.html" class="font-semibold text-cta underline">تسجيل الدخول</a>
              </p>
            </form>
            
                <div class="flex flex-col gap-3 pt-6 border-neutral-divider border-t">
                  <div class="gap-3 grid sm:grid-cols-2">
                    <!-- Google returns a verified email and no phone number,
                         so this button does NOT necessarily land on the
                         dashboard: initAuthUI routes an account with no mobile
                         on file to complete-mobile.html first. -->
                    <button type="button" data-google-signin class="flex justify-center items-center gap-2 hover:bg-interaction-base py-3 border border-neutral-divider rounded-full font-semibold text-[#062A1C] text-sm transition-colors">
                      <svg viewBox="0 0 24 24" class="w-5 h-5"><path fill="#4285F4" d="M22.6 12.2c0-.8-.1-1.6-.2-2.3H12v4.5h6c-.3 1.4-1.1 2.6-2.3 3.4v2.8h3.7c2.2-2 3.4-5 3.4-8.4Z"/><path fill="#34A853" d="M12 23c3.1 0 5.7-1 7.6-2.8l-3.7-2.8c-1 .7-2.3 1.1-3.9 1.1-3 0-5.5-2-6.4-4.7H1.8v2.9C3.7 20.5 7.6 23 12 23Z"/><path fill="#FBBC05" d="M5.6 13.8c-.2-.7-.4-1.4-.4-2.3s.1-1.6.4-2.3V6.3H1.8C1 7.9.5 9.9.5 11.5s.4 3.6 1.3 5.2l3.8-2.9Z"/><path fill="#EA4335" d="M12 4.6c1.7 0 3.2.6 4.4 1.7l3.3-3.3C17.7 1.2 15.1 0 12 0 7.6 0 3.7 2.5 1.8 6.3l3.8 2.9c.9-2.7 3.4-4.6 6.4-4.6Z"/></svg><span>سجل بأستخدام جوجل</span>
                    </button>
                    <button type="button" class="flex justify-center items-center gap-2 hover:bg-interaction-base py-3 border border-neutral-divider rounded-full font-semibold text-[#062A1C] text-sm transition-colors">
                      <svg viewBox="0 0 24 24" fill="#1877F2" class="w-5 h-5"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06C2 17.06 5.66 21.21 10.44 22v-7.03H7.9v-2.9h2.54V9.85c0-2.51 1.49-3.9 3.78-3.9 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.87h2.78l-.44 2.9h-2.34V22C18.34 21.21 22 17.06 22 12.06Z"/></svg><span>سجل بأستخدام فيسبوك</span>
                    </button>
                  </div>
                </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Shared footer is injected here by scripts.js -->
    <div id="site-footer"></div>
  </body>
</html>
