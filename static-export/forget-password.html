<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>نسيت كلمة المرور | أبو عوف</title>
    <meta name="description" content="استعد كلمة المرور الخاصة بحسابك في أبو عوف." />
    <!-- Tailwind (Play CDN) + Abu Auf design system -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tw-config.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="images/abuauf/brand/logo-abuauf-white.svg" />
    <script defer src="scripts.js"></script>
  </head>
  <body data-page="forget-password" data-path="/forget-password" class="antialiased bg-white">
    <!-- Shared header is injected here by scripts.js -->
    <div id="site-header"></div>

    <main class="overflow-x-hidden">
      <section class="pt-6">
        <div class="flex flex-col gap-4 mx-auto px-4 xl:px-[190px] max-w-[1920px]">
          <nav aria-label="مسار التنقل" class="flex flex-wrap items-center gap-2 text-sm"><a href="index.html" class="text-neutral-secondary hover:text-primary transition-colors">الرئيسية</a><span aria-hidden="true" class="text-neutral-outline">/</span><span class="font-semibold text-[#062A1C]">نسيت كلمة المرور</span></nav>
          <h1 class="font-bold text-[#062A1C] text-3xl xl:text-5xl"></h1>
        </div>
      </section>

      <section class="py-8 xl:py-12">
        <div class="items-start gap-6 xl:gap-8 grid grid-cols-1 max-w-[560px] mx-auto mx-auto px-4 xl:px-[190px] max-w-[1920px]">
          
          <div class="flex flex-col gap-6 bg-white shadow-custom4 p-8 xl:p-10 rounded-[20px] min-w-0">
            <h1 class="font-bold text-[#062A1C] text-2xl xl:text-3xl text-center">نسيت كلمة المرور</h1>
            <form class="flex flex-col gap-5">
              <p class="text-neutral-secondary text-sm text-center leading-7">
                أدخل البريد الالكتروني المسجل وهنبعتلك رابط لإعادة تعيين كلمة المرور.
              </p>

                <div class="flex flex-col gap-1.5 ">
                  <label for="email" class="font-medium text-neutral-secondary text-sm">البريد الالكتروني<span class="text-accent-error">*</span></label>
                  <input type="email" id="email" name="email" required
                         value="" placeholder=""
                         class="bg-white px-4 py-3 border-2 border-neutral-divider focus:border-cta rounded-xl outline-none w-full text-[#062A1C] text-base transition-colors" />
                </div>
              <button type="submit" class="bg-cta hover:bg-cta-hover py-4 rounded-full font-semibold text-white text-base transition-colors">أرسال</button>
              <a href="login.html" class="font-semibold text-cta text-sm text-center underline">العودة لتسجيل الدخول</a>
            </form>
            
          </div>
        </div>
      </section>
    </main>

    <!-- Shared footer is injected here by scripts.js -->
    <div id="site-footer"></div>
  </body>
</html>
