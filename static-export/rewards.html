<!doctype html>
<html lang="ar" dir="rtl">
  <head>

    <title>المكافآت | أبو عوف</title>

    <!-- Tailwind (Play CDN) + Abu Auf design system -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tw-config.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="images/abuauf/brand/logo-abuauf-white.webp" />
    <script defer src="scripts.js"></script>

  <body data-page="rewards" data-path="/rewards" class="antialiased bg-white">

    <div id="site-header"></div>

      <section class="pt-6">

        </div>

            <a href="my-account-wallet.html" class="inline-flex justify-center items-center rounded-full font-semibold transition-colors px-8 py-3 text-base border border-cta text-cta hover:bg-interaction-base ">محفظتي</a>
